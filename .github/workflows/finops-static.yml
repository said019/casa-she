name: Frontend static runtime regression
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/finops-static.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/finops-static.yml'
permissions:
  contents: read
jobs:
  static-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev
      - run: npm run build
      - run: node scripts/prepare-static-runtime.mjs
      - run: node scripts/test-caddy-static.mjs
