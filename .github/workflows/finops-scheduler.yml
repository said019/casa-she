name: Backend scheduler regression
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/finops-scheduler.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/finops-scheduler.yml'
permissions:
  contents: read
jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:finops
